name: Best Archive Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First-deploy bootstrap (mark all items seen, skip dispatch)"
        type: boolean
        default: false

concurrency:
  group: best-archive-bot
  cancel-in-progress: false

# Opt the Node-20 actions (checkout, cache, setup-go) into the Node 24 runtime
# before the 2026-06-02 forced cutover. actions/cache has no Node-24 release
# yet, so this env var covers every action at once.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      NOTIFICATION_HUB_URL: ${{ secrets.NOTIFICATION_HUB_URL }}
      NOTIFICATION_SECRET: ${{ secrets.NOTIFICATION_SECRET }}
      BOOTSTRAP_DEDUP: ${{ github.event.inputs.bootstrap == 'true' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      # 연속 실패 감지: 최근 5회 모두 실패면 워크플로우 자동 비활성화
      - name: Check consecutive failures
        id: check-failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURES=$(gh run list --workflow=bot.yml --limit=5 --json conclusion \
            --jq '[.[] | select(.conclusion == "failure")] | length')
          echo "consecutive_failures=$FAILURES" >> "$GITHUB_OUTPUT"
          if [ "$FAILURES" -ge 5 ]; then
            echo "🛑 5회 연속 실패 감지 — 워크플로우를 자동 비활성화합니다."
            gh workflow disable bot.yml
            # 관리자에게 알림
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${ADMIN_ID}" \
              -d text="🛑 best-archive-bot 자동 비활성화%0A5회 연속 실패로 워크플로우를 중단했습니다.%0A확인 후 수동으로 재활성화하세요.%0Agh workflow enable bot.yml"
            exit 1
          fi

      # go.mod uses `replace ../txid-bot-framework`. Stage the framework
      # as a sibling so the GHA build resolves it.
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: bc1qwerty/txid-bot-framework
          path: txid-bot-framework-checkout
          ref: main

      - name: Stage framework sibling
        run: mv txid-bot-framework-checkout ../txid-bot-framework

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -o best-archive-bot .

      - name: Restore DB cache
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          # Include the WAL sidecars so dedup state survives even if a run
          # exits before its checkpoint folds the WAL into the main .db.
          path: |
            data/posts.db
            data/posts.db-wal
            data/posts.db-shm
          key: posts-db-${{ github.run_id }}
          restore-keys: posts-db-

      # ⚠ dedup 상태의 유일한 사본이 GitHub Actions 캐시다. 캐시가 축출되면
      #   (7일 미접근, 리포 10GB 초과, 수동 삭제) `data/posts.db` 가 없는 채로
      #   봇이 뜨고, 프레임워크는 빈 DB 를 보고 **크롤한 글 전부를 신규로** 판정한다.
      #   그 다음이 문제다 — MaxItemsPerPoll 을 넘는 분량은 발송 없이 seen 처리돼
      #   **영구 유실**된다(2026-09-08 safety_alarm 에서 실제로 7건이 그렇게 사라졌다.
      #   거기서는 방아쇠가 낡은 바이너리였고, 여기서는 인프라 이벤트라는 차이뿐이다).
      #   게다가 캐시 미스는 job 실패가 아니라서 아래 Telegram 경보도 안 울린다 —
      #   조용히 유실되고 아무도 모른다.
      #
      #   복구 방법은 "이번 판을 버리는 것" 이다. BOOTSTRAP_DEDUP=1 로 돌리면 크롤한
      #   글을 **발송 없이** 전부 seen 처리하고 끝낸다. 한 주기(3시간) 분량의 글을
      #   놓치지만, 그 대신 대량 중복 발송도 조용한 유실도 없다. 다음 실행부터 정상.
      - name: Detect dedup cache loss
        id: dedup-state
        run: |
          if [ -s data/posts.db ]; then
            echo "bootstrap=0" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=1" >> "$GITHUB_OUTPUT"
            echo "::warning::dedup DB 캐시가 없다(matched-key='${{ steps.restore-db.outputs.cache-matched-key }}') — 이번 실행은 발송 없이 dedup 재수립만 한다."
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${ADMIN_ID}" \
              -d text="🟠 best-archive dedup 캐시 유실%0A이번 실행은 발송 없이 재수립만 합니다(글 한 주기 누락).%0A반복되면 캐시 대신 영속 저장소를 검토하세요.%0A로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              > /dev/null || true
          fi

      - name: Run bot (one-shot)
        run: BOOTSTRAP_DEDUP=${{ steps.dedup-state.outputs.bootstrap }} ./best-archive-bot

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/posts.db
            data/posts.db-wal
            data/posts.db-shm
          key: posts-db-${{ github.run_id }}

      - name: Notify failure to Telegram
        if: failure() && steps.check-failures.outputs.consecutive_failures < 5
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_ID}" \
            -d text="🚨 GitHub Actions 실패%0A워크플로우: ${{ github.workflow }}%0A커밋: ${{ github.sha }}%0A로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
