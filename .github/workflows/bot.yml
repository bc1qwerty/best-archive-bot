name: Best Archive Bot

on:
  schedule:
    # ⚠**이 schedule 은 이제 폴백이다.** 주 트리거는 맥 launchd
    #   `uk.txid.gha-dispatch-best-archive`(15분 주기)가 `gh workflow run` 으로 깨운다.
    #   맥이 꺼져 있을 때만 아래 cron 이 의미가 있다(그때도 하루 5~8회는 돈다).
    # ⚠**분 오프셋 조정은 효과가 없었다 — 다시 시도하지 말 것.** 아래 근거대로 7,22,37,52
    #   로 옮긴 뒤 20.4시간 재측정한 결과 **4회**(설계 82회 대비), 즉 변경 전 6.6회/일에서
    #   4.7회/일로 **오히려 줄었다**(2026-09-15). 형제 리포 safety_alarm 도 같은 결과였다.
    #   GitHub 의 cron 배달은 best-effort 이고 우리가 돌릴 손잡이는 여기 없다.
    # (아래는 그때의 근거 기록)
    # ⚠분(minute)을 0,15,30,45(`*/15`)가 아니라 7,22,37,52 로 둔 이유: GitHub 의
    #   스케줄러는 정시·15분 단위 정각에 가장 붐벼 큐잉이 심하다(공식 문서도
    #   "run at a different time of the hour" 를 권고한다). `*/15` 이던
    #   2026-09-08~14 실측은 설계 96회/일 중 **8회 안팎만** 실제로 돌았고,
    #   폴 간격이 2~6시간까지 벌어졌다. 그 공백이 곧 main.go 의 maxSendPerRun
    #   초과 → 「발송 없는 seen」 영구 유실로 이어졌다(최근 16회 중 5회가
    #   상한에 걸려 17건). 형제 리포 safety_alarm_bot 이 같은 진단으로
    #   0,30 → 7,37 로 옮겨 갔다. 분 오프셋은 이를 완화하는 리포 안의 유일한
    #   손잡이다 — 바꾼 뒤 gh run list 로 실행 횟수가 실제로 늘었는지 다시 잴 것.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First-deploy bootstrap (mark all items seen, skip dispatch)"
        type: boolean
        default: false

concurrency:
  group: best-archive-bot
  cancel-in-progress: false

# ⚠`gh workflow disable`(아래 5회 임계)은 actions:write 가 필요하다. 이 리포의
#   기본 워크플로 권한은 read 이고(gh api …/actions/permissions/workflow 로 실측,
#   2026-09-15) 여기에 permissions 선언이 없어서 **그 호출은 항상 403** 이었다.
#   GHA 의 기본 셸은 `bash -e` 라 403 이 나면 그 자리에서 스텝이 끝나고,
#   바로 다음 줄의 관리자 텔레그램까지 함께 사라졌다 — 즉 «가장 사람이 필요한
#   순간에» 설계된 경보가 한 번도 울릴 수 없는 상태였다.
permissions:
  contents: read
  actions: write

# Opt the Node-20 actions (checkout, cache, setup-go) into the Node 24 runtime
# before the 2026-06-02 forced cutover. actions/cache has no Node-24 release
# yet, so this env var covers every action at once.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      NOTIFICATION_HUB_URL: ${{ secrets.NOTIFICATION_HUB_URL }}
      NOTIFICATION_SECRET: ${{ secrets.NOTIFICATION_SECRET }}
      BOOTSTRAP_DEDUP: ${{ github.event.inputs.bootstrap == 'true' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      # 연속 실패 감지: 최근 5회 모두 실패면 워크플로우 자동 비활성화
      - name: Check consecutive failures
        id: check-failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURES=$(gh run list --workflow=bot.yml --status completed --limit=5 --json conclusion \
            --jq '[.[] | select(.conclusion == "failure")] | length')
          echo "consecutive_failures=$FAILURES" >> "$GITHUB_OUTPUT"
          if [ "$FAILURES" -ge 5 ]; then
            echo "🛑 5회 연속 실패 감지"
            # ⚠순서가 중요하다. 알림이 먼저다 — 비활성화가 실패해도 사람에게는
            #   반드시 닿아야 한다. 예전에는 disable 이 먼저였고, 그것이 403 으로
            #   죽으면서 이 알림까지 통째로 못 나갔다.
            # ⚠`-sS --fail-with-body` 로 바꾼다. `-s` 만 쓰면 401/403/429 도
            #   exit 0 이라 «보냈다고 믿는데 안 간» 상태가 된다.
            if curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                 -d chat_id="${ADMIN_ID}" \
                 -d text="🛑 best-archive-bot 5회 연속 실패%0A워크플로우 비활성화를 시도합니다.%0A재활성화: gh workflow enable bot.yml"; then
              echo "paged=1" >> "$GITHUB_OUTPUT"
            else
              echo "::error::관리자 텔레그램 발송 실패 — 아래 비활성화만 시도한다"
            fi
            gh workflow disable bot.yml || echo "::error::gh workflow disable 실패(actions:write 권한 확인)"
            exit 1
          fi

      # go.mod uses `replace ../txid-bot-framework`. Stage the framework
      # as a sibling so the GHA build resolves it.
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: bc1qwerty/txid-bot-framework
          path: txid-bot-framework-checkout
          ref: main

      - name: Stage framework sibling
        run: mv txid-bot-framework-checkout ../txid-bot-framework

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -o best-archive-bot .

      - name: Restore DB cache
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          # Include the WAL sidecars so dedup state survives even if a run
          # exits before its checkpoint folds the WAL into the main .db.
          path: |
            data/posts.db
            data/posts.db-wal
            data/posts.db-shm
          key: posts-db-${{ github.run_id }}
          restore-keys: posts-db-

      # ⚠ dedup 상태의 유일한 사본이 GitHub Actions 캐시다. 캐시가 축출되면
      #   (7일 미접근, 리포 10GB 초과, 수동 삭제) `data/posts.db` 가 없는 채로
      #   봇이 뜨고, 프레임워크는 빈 DB 를 보고 **크롤한 글 전부를 신규로** 판정한다.
      #   그 다음이 문제다 — MaxItemsPerPoll 을 넘는 분량은 발송 없이 seen 처리돼
      #   **영구 유실**된다(2026-09-08 safety_alarm 에서 실제로 7건이 그렇게 사라졌다.
      #   거기서는 방아쇠가 낡은 바이너리였고, 여기서는 인프라 이벤트라는 차이뿐이다).
      #   게다가 캐시 미스는 job 실패가 아니라서 아래 Telegram 경보도 안 울린다 —
      #   조용히 유실되고 아무도 모른다.
      #
      #   복구 방법은 "이번 판을 버리는 것" 이다. BOOTSTRAP_DEDUP=1 로 돌리면 크롤한
      #   글을 **발송 없이** 전부 seen 처리하고 끝낸다. 한 주기(3시간) 분량의 글을
      #   놓치지만, 그 대신 대량 중복 발송도 조용한 유실도 없다. 다음 실행부터 정상.
      #   판정은 cache-hit 출력이 아니라 **DB 안의 행 수**로 한다. restore-keys 로
      #   부분일치하면 cache-hit 은 false 이고, 반대로 스키마만 든 껍데기 DB 가
      #   복원되면 파일은 존재하는데 dedup 은 꺼져 있다(safety_alarm 에서 실제로
      #   250바이트 캐시가 그렇게 몇 주를 갔다). 쓸 수 있는 상태인지를 직접 본다.
      #
      #   ⚠ "판정 실패" 와 "0행" 을 구분한다. sqlite3 가 없어졌을 때 0행으로 뭉뚱그리면
      #   매 실행이 부트스트랩이 되어 **봇이 영구히 조용해진다** — 막으려던 유실보다
      #   나쁘다. 판정 불능이면 정상으로 두고 그 사실을 알린다.
      - name: Detect dedup cache loss
        id: dedup-state
        run: |
          DB=data/posts.db
          if ! command -v sqlite3 >/dev/null 2>&1; then
            BOOT=0; REASON="sqlite3 가 없어 판정 불능 — 이번엔 정상으로 두지만 유실 감시가 꺼져 있다"; LEVEL=warn
          elif [ ! -s "$DB" ]; then
            BOOT=1; REASON="DB 파일이 없거나 비어 있다(matched-key='${{ steps.restore-db.outputs.cache-matched-key }}')"; LEVEL=loss
          elif ! ROWS=$(sqlite3 "$DB" 'SELECT COUNT(*) FROM bot_seen;' 2>/dev/null); then
            BOOT=1; REASON="bot_seen 조회 실패 — 스키마가 깨졌다"; LEVEL=loss
          elif [ "$ROWS" -eq 0 ]; then
            BOOT=1; REASON="bot_seen 0행 — 껍데기 캐시가 복원됐다"; LEVEL=loss
          else
            BOOT=0; REASON="bot_seen ${ROWS}행 — 정상"; LEVEL=ok
          fi
          echo "bootstrap=$BOOT" >> "$GITHUB_OUTPUT"
          echo "판정: $REASON (bootstrap=$BOOT)"
          [ "$LEVEL" = ok ] && exit 0
          echo "::warning::$REASON"
          if [ "$LEVEL" = loss ]; then
            TEXT="🟠 best-archive dedup 캐시 유실%0A${REASON}%0A이번 실행은 발송 없이 재수립만 합니다(글 한 주기 누락).%0A반복되면 캐시 대신 영속 저장소를 검토하세요."
          else
            TEXT="🟠 best-archive dedup 감시 불능%0A${REASON}"
          fi
          # ⚠ 2026-09-15: 이 경보가 자기 실패를 삼키고 있었다. `-s … || true` 는 401·403·429 를
          #   전부 exit 0 으로 덮어서, dedup 캐시 유실이라는 «사람이 봐야 하는» 신호가
          #   말없이 사라질 수 있었다. 실패해도 봇 실행은 계속해야 하므로(여기서 죽이면
          #   이번 주기가 통째로 날아간다) 잡을 세우지는 않고 ::error:: 로 남긴다.
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_ID}" \
            -d text="${TEXT}%0A로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || echo "::error::경보 텔레그램 발송 실패 — dedup 유실이 사람에게 닿지 않았다"

      # 감지가 유실(1)을 봤을 때만 덮어쓴다 — 0을 무조건 주입하면 수동
      # dispatch 의 bootstrap 입력(job env)이 조용히 무시된다.
      - name: Run bot (one-shot)
        run: |
          if [ "${{ steps.dedup-state.outputs.bootstrap }}" = "1" ]; then
            export BOOTSTRAP_DEDUP=1
          fi
          ./best-archive-bot

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/posts.db
            data/posts.db-wal
            data/posts.db-shm
          key: posts-db-${{ github.run_id }}

      - name: Notify failure to Telegram
        # ⚠`< 5` 하나로 «임계 도달»과 «중복 방지»를 겸하면, 임계 경로가 실패했을 때
        #   폴백까지 같이 죽는다(5회째에 임계 스텝이 403 으로 죽으면 여기도 5<5 로
        #   스킵돼 알림이 0건이 됐다). 임계 스텝이 «실제로 알렸을 때»만 건너뛴다.
        if: failure() && steps.check-failures.outputs.paged != '1'
        run: |
          # ⚠이 스텝은 잡이 이미 실패했을 때만 돈다. 그래도 `-s` 만 쓰면 호출기 자신의
          #   401/403/429 가 exit 0 이 되어 «알렸다» 와 «못 알렸다» 가 구별되지 않는다.
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_ID}" \
            -d text="🚨 GitHub Actions 실패%0A워크플로우: ${{ github.workflow }}%0A커밋: ${{ github.sha }}%0A로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
